worker_processes auto;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  server {
    listen 80;
    server_name _;

    # Serve static
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing
    location / {
      try_files $uri $uri/ $uri.html /index.html;
    }
  }
}
